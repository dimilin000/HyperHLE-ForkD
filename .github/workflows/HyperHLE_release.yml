name: Build HyperHLE

on:
  workflow_dispatch:
    inputs:
      publish_hyperhle_release:
        description: Publish a HyperHLE release (after all builds succeed)
        type: boolean
        default: false
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  create: # for tags

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

jobs:
  build-osx:
    runs-on: macos-latest  

    steps:  
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Initialize pinned git submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Ensure pinned SDL source exists
        shell: bash
        run: |
          set -eu
          SDL_REVISION=07d0f51fa292895443f563f0cbde4cb3802d87fa
          SDL_DIR=vendor/SDL
          if [ ! -f "$SDL_DIR/CMakeLists.txt" ] || [ "$(git -C "$SDL_DIR" rev-parse HEAD 2>/dev/null || true)" != "$SDL_REVISION" ]; then
            rm -rf "$SDL_DIR"
            mkdir -p vendor
            git init "$SDL_DIR"
            git -C "$SDL_DIR" remote add origin https://github.com/libsdl-org/SDL.git
            git -C "$SDL_DIR" fetch --depth 1 origin "$SDL_REVISION"
            git -C "$SDL_DIR" checkout --detach FETCH_HEAD
          fi
          test -f "$SDL_DIR/CMakeLists.txt"
          test "$(git -C "$SDL_DIR" rev-parse HEAD)" = "$SDL_REVISION"

      - name: Ensure OpenAL Soft source exists
        shell: bash
        run: |
          if [ ! -f vendor/openal-soft/CMakeLists.txt ]; then
            echo "OpenAL Soft submodule is missing; fetching pinned release 1.25.2"
            rm -rf vendor/openal-soft
            git clone --depth 1 --branch 1.25.2 https://github.com/kcat/openal-soft.git vendor/openal-soft
          fi
          test -f vendor/openal-soft/CMakeLists.txt || { echo "OpenAL Soft source is still missing" >&2; exit 1; }

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master

      - name: Try to get cached copy of Boost  
        id: cache-boost  
        uses: actions/cache@main
        with:  
          path: vendor/boost  
          key: boost_1_81_0_macos  
          
      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
        name: Download Boost  
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"  
        
      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
        name: Extract Boost  
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost  

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Install x86_64 toolchain  
        run: rustup target add x86_64-apple-darwin  
        
      - name: Build  
        run: cargo build --target x86_64-apple-darwin --release  

      - name: Create .app bundle and DMG
        run: |
          set -eu
          cd dev-scripts
          ./make-macos-bundle.sh \
            ../target/x86_64-apple-darwin/release/touchHLE \
            "`cargo run --package touchHLE_version`" \
            "`cargo run --package touchHLE_version -- --branding`"
          mkdir touchHLE-dmg-src
          mv *.app touchHLE-dmg-src/
          touch touchHLE-dmg-src/.metadata_never_index || true
          if [ -d "/Volumes/touchHLE" ]; then
            hdiutil detach -force "/Volumes/touchHLE" || true
          fi
          attempt=1
          max_attempts=5
          until hdiutil create -ov -volname touchHLE \
              -srcfolder touchHLE-dmg-src touchHLE.dmg; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "hdiutil create still failed after $max_attempts attempts" >&2
              exit 1
            fi
            sleep_secs=$((attempt * 5))
            echo "hdiutil create failed (attempt $attempt); retrying in${sleep_secs}s" >&2
            if [ -d "/Volumes/touchHLE" ]; then
              hdiutil detach -force "/Volumes/touchHLE" || true
            fi
            sleep "$sleep_secs"
            attempt=$((attempt + 1))
          done
          mv touchHLE.dmg ..
          
      - uses: actions/upload-artifact@main
        with:
          name: HyperHLE_macOS_x86_64
          path: touchHLE.dmg

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Initialize pinned git submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Ensure pinned SDL source exists
        shell: bash
        run: |
          set -eu
          SDL_REVISION=07d0f51fa292895443f563f0cbde4cb3802d87fa
          SDL_DIR=vendor/SDL
          if [ ! -f "$SDL_DIR/CMakeLists.txt" ] || [ "$(git -C "$SDL_DIR" rev-parse HEAD 2>/dev/null || true)" != "$SDL_REVISION" ]; then
            rm -rf "$SDL_DIR"
            mkdir -p vendor
            git init "$SDL_DIR"
            git -C "$SDL_DIR" remote add origin https://github.com/libsdl-org/SDL.git
            git -C "$SDL_DIR" fetch --depth 1 origin "$SDL_REVISION"
            git -C "$SDL_DIR" checkout --detach FETCH_HEAD
          fi
          test -f "$SDL_DIR/CMakeLists.txt"
          test "$(git -C "$SDL_DIR" rev-parse HEAD)" = "$SDL_REVISION"

      - name: Ensure OpenAL Soft source exists
        shell: bash
        run: |
          if [ ! -f vendor/openal-soft/CMakeLists.txt ]; then
            echo "OpenAL Soft submodule is missing; fetching pinned release 1.25.2"
            rm -rf vendor/openal-soft
            git clone --depth 1 --branch 1.25.2 https://github.com/kcat/openal-soft.git vendor/openal-soft
          fi
          test -f vendor/openal-soft/CMakeLists.txt || { echo "OpenAL Soft source is still missing" >&2; exit 1; }

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libsndio-dev \
            libdbus-1-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxxf86vm-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@main
        with:
          path: vendor/boost
          key: boost_1_81_0_linux

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Extract Boost
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Build
        run: cargo build --release

      - name: Create bundle
        run: cd dev-scripts && ./make-linux-bundle.sh ../target/release/touchHLE && mv touchHLE_linux_bundle/ ..

      - uses: actions/upload-artifact@main
        with:
          name: HyperHLE_Linux_x86_64
          path: touchHLE_linux_bundle/

  build-android:
    runs-on: ubuntu-latest  

    steps:  
    - name: Checkout touchHLE
      uses: actions/checkout@main
      with:
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true

    - name: Initialize pinned git submodules
      shell: bash
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive

    - name: Ensure pinned SDL source exists
      shell: bash
      run: |
        set -eu
        SDL_REVISION=07d0f51fa292895443f563f0cbde4cb3802d87fa
        SDL_DIR=vendor/SDL
        if [ ! -f "$SDL_DIR/CMakeLists.txt" ] || [ "$(git -C "$SDL_DIR" rev-parse HEAD 2>/dev/null || true)" != "$SDL_REVISION" ]; then
          rm -rf "$SDL_DIR"
          mkdir -p vendor
          git init "$SDL_DIR"
          git -C "$SDL_DIR" remote add origin https://github.com/libsdl-org/SDL.git
          git -C "$SDL_DIR" fetch --depth 1 origin "$SDL_REVISION"
          git -C "$SDL_DIR" checkout --detach FETCH_HEAD
        fi
        test -f "$SDL_DIR/CMakeLists.txt"
        test "$(git -C "$SDL_DIR" rev-parse HEAD)" = "$SDL_REVISION"

    - name: Ensure OpenAL Soft source exists
      shell: bash
      run: |
        if [ ! -f vendor/openal-soft/CMakeLists.txt ]; then
          echo "OpenAL Soft submodule is missing; fetching pinned release 1.25.2"
          rm -rf vendor/openal-soft
          git clone --depth 1 --branch 1.25.2 https://github.com/kcat/openal-soft.git vendor/openal-soft
        fi
        test -f vendor/openal-soft/CMakeLists.txt || { echo "OpenAL Soft source is still missing" >&2; exit 1; }

    - name: Cache Rust build artifacts
      uses: actions/cache@main
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Try to get cached copy of Boost  
      id: cache-boost  
      uses: actions/cache@main
      with:  
        path: vendor/boost  
        key: boost_1_81_0  

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Download Boost  
      run: curl -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"  

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Extract Boost  
      run: 7z -ovendor x boost_1_81_0.7z && mv vendor/boost_1_81_0 vendor/boost  

    - name: Try to get cached copy of cmake  
      id: cache-cmake  
      uses: actions/cache@main
      with:  
        path: vendor/cmake  
        key: cmake_3_31_6_linux  

    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}  
      name: Download Cmake  
      run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz"  

    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}  
      name: Extract Cmake  
      run: tar xzvf "cmake-3.31.6-linux-x86_64.tar.gz" -C vendor && mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake  

    - name: Install AArch64 Android Rust toolchain  
      run: rustup target add aarch64-linux-android  

    - name: Install cargo-ndk  
      run: cargo install cargo-ndk@3.5.4  

    - name: Try to get a cached copy of Gradle  
      id: cache-gradle  
      uses: actions/cache@main
      with:  
        path: gradle  
        key: gradle-8.11.1  

    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}  
      name: Download Gradle  
      run: curl -L -o gradle-8.11.1-bin.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"  

    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}  
      name: Extract Gradle  
      run: 7z -ogradle x gradle-8.11.1-bin.zip  

    - name: Try to get a cached copy of Android NDK  
      id: cache-android-ndk  
      uses: actions/cache@main
      with:  
        path: android-ndk  
        key: android-ndk-r25c  

    - if: ${{ steps.cache-android-ndk.outputs.cache-hit != 'true' }}  
      name: Download Android NDK  
      run: curl -L -o android-ndk-r25c-linux.zip "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip"  

    - if: ${{ steps.cache-android-ndk.outputs.cache-hit != 'true' }}  
      name: Extract Android NDK  
      run: 7z -oandroid-ndk -snld x android-ndk-r25c-linux.zip  

    - name: Link Android NDK  
      run: ln -s $PWD'/android-ndk/android-ndk-r25c'$ANDROID_SDK_ROOT'/ndk/25.2.9519653'  

    - name: Generate local.properties file  
      run: echo 'sdk.dir='$ANDROID_SDK_ROOT > android/local.properties  

    - name: Build for Android  
      run: cd android && ../gradle/gradle-8.11.1/bin/gradle assembleRelease && mv app/build/outputs/apk/release/HyperHLE-Fork-release.apk ../HyperHLE-Fork.apk  
      env:  
        HYPERHLE_KEYSTORE_B64: ${{ secrets.HYPERHLE_KEYSTORE_B64 }}
        HYPERHLE_KEYSTORE_PASSWORD: ${{ secrets.HYPERHLE_KEYSTORE_PASSWORD }}
        HYPERHLE_KEY_ALIAS: ${{ secrets.HYPERHLE_KEY_ALIAS }}
        ANDROID_NDK_ROOT: '/usr/local/lib/android/sdk/ndk/25.2.9519653'  
        CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake  

    - uses: actions/upload-artifact@main
      with:  
        name: HyperHLE_Android_AArch64  
        path: HyperHLE-Fork.apk

  build-ios:
    needs: [check-hyperhle-release]
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    env:
      HYPERHLE_VERSION: ${{ needs.check-hyperhle-release.outputs.should_release == 'true' && needs.check-hyperhle-release.outputs.version || '' }}

    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Initialize pinned git submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Ensure pinned SDL source exists
        shell: bash
        run: |
          set -eu
          SDL_REVISION=07d0f51fa292895443f563f0cbde4cb3802d87fa
          SDL_DIR=vendor/SDL
          if [ ! -f "$SDL_DIR/CMakeLists.txt" ] || [ "$(git -C "$SDL_DIR" rev-parse HEAD 2>/dev/null || true)" != "$SDL_REVISION" ]; then
            rm -rf "$SDL_DIR"
            mkdir -p vendor
            git init "$SDL_DIR"
            git -C "$SDL_DIR" remote add origin https://github.com/libsdl-org/SDL.git
            git -C "$SDL_DIR" fetch --depth 1 origin "$SDL_REVISION"
            git -C "$SDL_DIR" checkout --detach FETCH_HEAD
          fi
          test -f "$SDL_DIR/CMakeLists.txt"
          test "$(git -C "$SDL_DIR" rev-parse HEAD)" = "$SDL_REVISION"

      - name: Ensure OpenAL Soft source exists
        shell: bash
        run: |
          if [ ! -f vendor/openal-soft/CMakeLists.txt ]; then
            echo "OpenAL Soft submodule is missing; fetching pinned release 1.25.2"
            rm -rf vendor/openal-soft
            git clone --depth 1 --branch 1.25.2 https://github.com/kcat/openal-soft.git vendor/openal-soft
          fi
          test -f vendor/openal-soft/CMakeLists.txt || { echo "OpenAL Soft source is still missing" >&2; exit 1; }

      - name: Select the newest installed Xcode
        run: |
          set -eu
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install build tools
        run: brew install ninja ldid

      - name: Install AArch64 iOS Rust toolchain
        run: rustup target add aarch64-apple-ios

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master
        with:
          workspaces: ". -> build/rust-ios-native"

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@main
        with:
          path: vendor/boost
          key: boost_1_81_0_macos

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Extract Boost
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Build shared SDL2 for iOS
        run: sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build the iOS app
        run: sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Package the IPAs
        run: |
          set -eu
          sh platform/ios/scripts/package-ipa.sh
          sh platform/ios/scripts/package-ipa.sh --trollstore
          sh platform/ios/scripts/package-ipa.sh --trollstore-permanent-jit

      - name: Verify the IPAs
        run: |
          set -eu
          sh platform/ios/scripts/verify-ipa.sh dist/HyperHLE-iOS-unsigned.ipa
          sh platform/ios/scripts/verify-ipa.sh --trollstore dist/HyperHLE-iOS-trollstore.ipa
          sh platform/ios/scripts/verify-ipa.sh --trollstore-permanent-jit dist/HyperHLE-iOS-trollstore-permanent-jit.ipa

      - uses: actions/upload-artifact@main
        with:
          path: dist/HyperHLE-iOS-unsigned.ipa
          archive: false

      - uses: actions/upload-artifact@main
        with:
          path: dist/HyperHLE-iOS-trollstore.ipa
          archive: false

      - uses: actions/upload-artifact@main
        with:
          path: dist/HyperHLE-iOS-trollstore-permanent-jit.ipa
          archive: false

  build-win:
    runs-on: windows-2022  

    steps:  
    - name: Checkout touchHLE
      uses: actions/checkout@main
      with:
        submodules: recursive

    - name: Initialize pinned git submodules
      shell: bash
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive

    - name: Ensure pinned SDL source exists
      shell: bash
      run: |
        set -eu
        SDL_REVISION=07d0f51fa292895443f563f0cbde4cb3802d87fa
        SDL_DIR=vendor/SDL
        if [ ! -f "$SDL_DIR/CMakeLists.txt" ] || [ "$(git -C "$SDL_DIR" rev-parse HEAD 2>/dev/null || true)" != "$SDL_REVISION" ]; then
          rm -rf "$SDL_DIR"
          mkdir -p vendor
          git init "$SDL_DIR"
          git -C "$SDL_DIR" remote add origin https://github.com/libsdl-org/SDL.git
          git -C "$SDL_DIR" fetch --depth 1 origin "$SDL_REVISION"
          git -C "$SDL_DIR" checkout --detach FETCH_HEAD
        fi
        test -f "$SDL_DIR/CMakeLists.txt"
        test "$(git -C "$SDL_DIR" rev-parse HEAD)" = "$SDL_REVISION"

    - name: Ensure OpenAL Soft source exists
      shell: bash
      run: |
        if [ ! -f vendor/openal-soft/CMakeLists.txt ]; then
          echo "OpenAL Soft submodule is missing; fetching pinned release 1.25.2"
          rm -rf vendor/openal-soft
          git clone --depth 1 --branch 1.25.2 https://github.com/kcat/openal-soft.git vendor/openal-soft
        fi
        test -f vendor/openal-soft/CMakeLists.txt || { echo "OpenAL Soft source is still missing" >&2; exit 1; }

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@master

    - name: Try to get cached copy of Boost  
      id: cache-boost  
      uses: actions/cache@main
      with:  
        path: vendor\boost  
        key: boost_1_81_0  
        
    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Download Boost  
      run: curl -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"  
      
    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Extract Boost  
      run: 7z -ovendor x boost_1_81_0.7z && ren vendor\boost_1_81_0 boost  

    - name: Setup CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~3.29.0"

    - name: Build  
      run: cargo build --release  

    - name: Create bundle  
      shell: bash  
      run: cd dev-scripts && ./make-windows-bundle.sh ../target/release/touchHLE.exe && mv touchHLE_windows_bundle/ ..  
      
    - uses: actions/upload-artifact@main
      with:  
        name: HyperHLE_Windows_x86_64  
        path: touchHLE_windows_bundle/

  check-hyperhle-release:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/trunk') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      changelog_from: ${{ steps.check.outputs.changelog_from }}
      changelog_limit: ${{ steps.check.outputs.changelog_limit }}
    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check whether a HyperHLE release is due
        id: check
        env:
          FORCE_HYPERHLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_hyperhle_release && 'true' || '' }}
        run: bash ./dev-scripts/hyperhle-should-release.sh

  publish-hyperhle-release:
    needs: [check-hyperhle-release, build-osx, build-linux, build-android, build-win, build-ios]
    if: >-
      needs.check-hyperhle-release.result == 'success' &&
      needs.check-hyperhle-release.outputs.should_release == 'true' &&
      needs.build-osx.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.build-win.result == 'success' &&
      needs.build-ios.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - name: Download macOS artifact
        uses: actions/download-artifact@main
        with:
          name: HyperHLE_macOS_x86_64
          path: artifacts/macos
      - name: Download Android artifact
        uses: actions/download-artifact@main
        with:
          name: HyperHLE_Android_AArch64
          path: artifacts/android
      - name: Download Windows artifact
        uses: actions/download-artifact@main
        with:
          name: HyperHLE_Windows_x86_64
          path: artifacts/windows
      - name: Download Linux artifact
        uses: actions/download-artifact@main
        with:
          name: HyperHLE_Linux_x86_64
          path: artifacts/linux
      - name: Download iOS unsigned IPA
        uses: actions/download-artifact@main
        with:
          name: HyperHLE-iOS-unsigned.ipa
          path: artifacts/ios
      - name: Download iOS TrollStore IPA
        uses: actions/download-artifact@main
        with:
          name: HyperHLE-iOS-trollstore.ipa
          path: artifacts/ios
      - name: Download iOS TrollStore permanent-JIT IPA
        uses: actions/download-artifact@main
        with:
          name: HyperHLE-iOS-trollstore-permanent-jit.ipa
          path: artifacts/ios
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc zip
      - name: Package HyperHLE release files
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          FORCE_HYPERHLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_hyperhle_release && 'true' || '' }}
          VERSION: ${{ needs.check-hyperhle-release.outputs.version }}
          CHANGELOG_FROM: ${{ needs.check-hyperhle-release.outputs.changelog_from }}
          CHANGELOG_LIMIT: ${{ needs.check-hyperhle-release.outputs.changelog_limit }}
        run: ./dev-scripts/package-hyperhle-release.sh "$VERSION" "$CHANGELOG_LIMIT"
      - name: Publish HyperHLE release
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ needs.check-hyperhle-release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HyperHLE ${{ needs.check-hyperhle-release.outputs.version }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/HyperHLE_*.zip
            release/HyperHLE-iOS-*.ipa
          fail_on_unmatched_files: true